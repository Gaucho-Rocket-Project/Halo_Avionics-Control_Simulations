name: Build Desktop Applications

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Windows/Linux layout (macOS always uses an .app bundle)
        type: choice
        options: [onedir, onefile]
        default: onedir
  push:
    tags: ['sensor-v*']
  pull_request:
    paths: ['Visualizer/**', '.github/workflows/build-desktop.yml']

permissions:
  contents: read

jobs:
  native-build:
    name: ${{ matrix.target }} / ${{ matrix.cpu }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows
            cpu: x86_64
            python-arch: x64
          - os: macos-15-intel
            target: macos
            cpu: x86_64
            python-arch: x64
          - os: macos-15
            target: macos
            cpu: arm64
            python-arch: arm64
          - os: ubuntu-22.04
            target: linux
            cpu: x86_64
            python-arch: x64
          - os: ubuntu-22.04-arm
            target: linux
            cpu: arm64
            python-arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python-arch }}
          cache: pip
          cache-dependency-path: 'Visualizer/requirements*.txt'
      - name: Install Linux GUI and packaging libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb xauth binutils libx11-6 libxext6 libxrender1 libfontconfig1
      - name: Install build dependencies
        run: python -m pip install -r Visualizer/requirements-build.txt
      - name: Run unit tests
        run: python -B -m unittest discover -s python_app -v
      - name: Build and smoke-test the native application
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_MODE: ${{ matrix.target == 'macos' && 'onedir' || inputs.mode || 'onedir' }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python Visualizer/build_app.py --target "$BUILD_TARGET" --mode "$BUILD_MODE"
          else
            python Visualizer/build_app.py --target "$BUILD_TARGET" --mode "$BUILD_MODE"
          fi
      - name: Upload application archive, metadata, and checksums
        uses: actions/upload-artifact@v4
        with:
          name: SensorTelemetry-${{ matrix.target }}-${{ matrix.cpu }}
          path: Visualizer/dist/native/**/releases/*
          if-no-files-found: error
          retention-days: 30